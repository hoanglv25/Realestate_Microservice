# =============================================================================
# Ha tang local cho he thong thue nha.
# Chay tu thu muc goc repo (de doc .env goc):
#   docker compose --env-file .env -f infra/compose/docker-compose.yml --profile dev up -d
#   docker compose --env-file .env -f infra/compose/docker-compose.yml --profile demo up -d
#   docker compose --env-file .env -f infra/compose/docker-compose.yml --profile dev --profile apps up -d --build
#
# Profile:
#   dev  : postgres, redis, rabbitmq (+ rabbitmq-init chay mot lan), mailpit. Object storage la Cloudflare R2
#          (dich vu ngoai, ADR-0016), khong co container.
#   demo : dev + elasticsearch + kibana (de do RAM; ELK day du o GD10)
#   apps : cac service ung dung (identity, api-gateway). Luon chay KEM dev hoac demo.
#          Truoc khi up: pnpm keys:generate (secrets/jwt-*.pem) va migration cua tung service.
#
# Chon image: ghim phien ban cu the, khong dung "latest" de ket qua tai lap duoc.
# Cong chi bind 127.0.0.1 de khong lo ra mang LAN.
# =============================================================================
name: realestate

x-restart: &restart
  restart: unless-stopped

services:
  # PostGIS 16 (ban 3.5) - listing_db can postgis; ban Debian (khong alpine) cho tuong thich extension.
  postgres:
    <<: *restart
    image: postgis/postgis:16-3.5
    container_name: re-postgres
    profiles: [dev, demo]
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?thieu POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?thieu POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DEFAULT_DB:-postgres}
      # Truyền cho script init (infra/compose/postgres/init/01-create-databases.sh)
      IDENTITY_DB_NAME: ${IDENTITY_DB_NAME:?thieu IDENTITY_DB_NAME}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:?thieu IDENTITY_DB_USER}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?thieu IDENTITY_DB_PASSWORD}
      LISTING_DB_NAME: ${LISTING_DB_NAME:?thieu LISTING_DB_NAME}
      LISTING_DB_USER: ${LISTING_DB_USER:?thieu LISTING_DB_USER}
      LISTING_DB_PASSWORD: ${LISTING_DB_PASSWORD:?thieu LISTING_DB_PASSWORD}
      RENTAL_DB_NAME: ${RENTAL_DB_NAME:?thieu RENTAL_DB_NAME}
      RENTAL_DB_USER: ${RENTAL_DB_USER:?thieu RENTAL_DB_USER}
      RENTAL_DB_PASSWORD: ${RENTAL_DB_PASSWORD:?thieu RENTAL_DB_PASSWORD}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME:?thieu PAYMENT_DB_NAME}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER:?thieu PAYMENT_DB_USER}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?thieu PAYMENT_DB_PASSWORD}
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:?thieu NOTIFICATION_DB_NAME}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER:?thieu NOTIFICATION_DB_USER}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?thieu NOTIFICATION_DB_PASSWORD}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Script init chỉ chạy lần đầu khi volume trống
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [realestate-net]

  # Redis 7.4 (alpine, nhe). Bat mat khau va AOF de khong mat du lieu khi restart.
  redis:
    <<: *restart
    image: redis:7.4-alpine
    container_name: re-redis
    profiles: [dev, demo]
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:?thieu REDIS_PASSWORD}',
        '--appendonly',
        'yes',
      ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [realestate-net]

  # Mailpit: SMTP gia + giao dien xem email (OTP, dat lai mat khau cua identity). Khong gui email that.
  # SMTP 1025, giao dien http://localhost:8025. Ghim ban v1.32.0 (khong dung latest).
  mailpit:
    <<: *restart
    image: axllent/mailpit:v1.32.0
    container_name: re-mailpit
    profiles: [dev, demo]
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [realestate-net]

  # RabbitMQ 3.13 (ban 3.x ben vung, co management UI). Chua len 4.x de tranh doi hanh vi.
  rabbitmq:
    <<: *restart
    image: rabbitmq:3.13-management
    container_name: re-rabbitmq
    profiles: [dev, demo]
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?thieu RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?thieu RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - '127.0.0.1:${RABBITMQ_PORT:-5672}:5672'
      - '127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ../rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-realestate.conf:ro
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s
    networks: [realestate-net]

  # Container chay MOT LAN: POST infra/rabbitmq/definitions.json vao Management API roi thoat.
  # - Tai khoan lay tu .env (RABBITMQ_USER/PASSWORD) nen .env la nguon duy nhat, file JSON khong chua bi mat.
  # - POST /api/definitions la idempotent: chay lai nhieu lan van an toan.
  # - depends_on.restart=true: rabbitmq duoc compose khoi dong lai thi init chay lai.
  # - Day la tac vu mot lan nen khong co healthcheck; thanh cong khi trang thai "Exited (0)".
  # - curlimages/curl ghim 8.11.1 (image nho, co curl; image rabbitmq khong co curl).
  rabbitmq-init:
    image: docker.io/curlimages/curl:8.11.1
    container_name: re-rabbitmq-init
    profiles: [dev, demo]
    restart: 'no'
    depends_on:
      rabbitmq:
        condition: service_healthy
        restart: true
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:?thieu RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?thieu RABBITMQ_PASSWORD}
    volumes:
      - ../rabbitmq/definitions.json:/definitions.json:ro
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        curl --silent --show-error --fail-with-body
        --retry 10 --retry-delay 3 --retry-connrefused --retry-all-errors
        --user "$$RABBITMQ_USER:$$RABBITMQ_PASSWORD"
        --header 'Content-Type: application/json'
        --request POST --data-binary @/definitions.json
        http://rabbitmq:15672/api/definitions
        && echo 'rabbitmq-init: da nap topology tu definitions.json'
    networks: [realestate-net]

  # Object storage: Cloudflare R2 (dich vu ngoai, API S3), KHONG chay container - xem
  # project-knowledge/decisions/0016-object-storage-cloudflare-r2-bo-silo.md. Bucket tao san tren dashboard R2;
  # listing, payment lay S3_* tu .env.

  # Elasticsearch 8.15 single-node, heap 512m, tat security (CHI cho dev/demo local).
  # Khong publish cong ra host: Kibana goi qua network noi bo.
  elasticsearch:
    <<: *restart
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    container_name: re-elasticsearch
    profiles: [demo]
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -s http://localhost:9200/_cluster/health | grep -Eq ''"status":"(green|yellow)"''',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks: [realestate-net]

  # Kibana cung phien ban voi Elasticsearch (bat buoc cung major.minor).
  kibana:
    <<: *restart
    image: docker.elastic.co/kibana/kibana:8.15.5
    container_name: re-kibana
    profiles: [demo]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      NODE_OPTIONS: --max-old-space-size=512
    ports:
      - '127.0.0.1:${KIBANA_PORT:-5601}:5601'
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD-SHELL', 'curl -s http://localhost:5601/api/status | grep -q ''"level":"available"''']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [realestate-net]

  # ---------------------------------------------------------------------------
  # Profile apps: service ung dung, build tu Dockerfile cua tung service (context = goc repo).
  # - Chi api-gateway publish cong ra host (127.0.0.1:8080). Service con lai KHONG publish:
  #   client chi vao qua gateway, /internal/* khong goi duoc tu ngoai.
  # - Trong Docker dung ten service lam host (postgres:5432, identity:3001...), KHONG dung
  #   cac bien *_HOST, INTERNAL_*_URL cua .env goc (cac bien do danh cho tien trinh tren laptop).
  # - Khoa JWT dua vao bang `secrets:` (mount tai /run/secrets/<ten>, chi doc).
  #   identity nhan ca khoa rieng (ky token) lan khoa cong khai (kiem /me);
  #   api-gateway chi nhan khoa cong khai.
  # - Migration KHONG tu chay (migrationsRun=false): chay tu host truoc khi up, vi du
  #   pnpm --filter @realestate/identity migration:run
  # ---------------------------------------------------------------------------

  # identity-service: dang ky, dang nhap, phat hanh JWT RS256. Publish event qua outbox -> RabbitMQ.
  identity:
    <<: *restart
    build:
      context: ../..
      dockerfile: services/identity/Dockerfile
    container_name: re-identity
    profiles: [apps]
    environment:
      SERVICE_NAME: identity
      PORT: '3001'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-3000}
      DATABASE_URL: postgres://${IDENTITY_DB_USER:?thieu IDENTITY_DB_USER}:${IDENTITY_DB_PASSWORD:?thieu IDENTITY_DB_PASSWORD}@postgres:5432/${IDENTITY_DB_NAME:?thieu IDENTITY_DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD:?thieu REDIS_PASSWORD}@redis:6379
      # vhost "/" phai viet %2F
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?thieu RABBITMQ_USER}:${RABBITMQ_PASSWORD:?thieu RABBITMQ_PASSWORD}@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-domain.events}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ISSUER: ${JWT_ISSUER:?thieu JWT_ISSUER}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-604800}
      # De trong thi chinh identity bao thieu va dung (khong dung `:?` vi se lam hong ca `infra:up`
      # cua nguoi chua them bien). Sinh khoa: xem .env.example
      BANK_ACCOUNT_ENCRYPTION_KEY: ${BANK_ACCOUNT_ENCRYPTION_KEY:-}
      # Email OTP, dat lai mat khau: trong Docker dung ten service mailpit (khong phai localhost)
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      MAIL_FROM: ${MAIL_FROM:-no-reply@realestate.local}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      PASSWORD_RESET_TTL_SECONDS: ${PASSWORD_RESET_TTL_SECONDS:-900}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:3000/reset-password}
      # De trong thi route dang nhap Google tra 503, service van chay
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    secrets: [jwt_private_key, jwt_public_key]
    # Khong co `ports:`: chi goi duoc trong mang realestate-net (qua api-gateway)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
    networks: [realestate-net]

  # listing-service: san pham cua chu tro, duyet, anh (S3). Khong phat, khong nghe su kien, khong dung Redis.
  # Migration chay tu host truoc khi up: pnpm --filter @realestate/listing migration:run
  listing:
    <<: *restart
    build:
      context: ../..
      dockerfile: services/listing/Dockerfile
    container_name: re-listing
    profiles: [apps]
    environment:
      SERVICE_NAME: listing
      PORT: '3002'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-3000}
      DATABASE_URL: postgres://${LISTING_DB_USER:?thieu LISTING_DB_USER}:${LISTING_DB_PASSWORD:?thieu LISTING_DB_PASSWORD}@postgres:5432/${LISTING_DB_NAME:?thieu LISTING_DB_NAME}
      # Cloudflare R2 (ADR-0016): service va trinh duyet cung goi mot endpoint cong khai, khong can S3_PUBLIC_ENDPOINT
      S3_ENDPOINT: ${S3_ENDPOINT:?thieu S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?thieu S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?thieu S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKETS: ${S3_BUCKET_LISTING_IMAGES:-listing-images}
      # listing chi KIEM token (khoa cong khai), khong ky
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ISSUER: ${JWT_ISSUER:?thieu JWT_ISSUER}
      LISTING_IMAGE_MAX_BYTES: ${LISTING_IMAGE_MAX_BYTES:-5242880}
      LISTING_IMAGE_MAX_COUNT: ${LISTING_IMAGE_MAX_COUNT:-10}
      LISTING_IMAGE_TYPES: ${LISTING_IMAGE_TYPES:-image/jpeg,image/png,image/webp}
    secrets: [jwt_public_key]
    # Khong co `ports:`: chi goi duoc trong mang realestate-net (qua api-gateway)
    depends_on:
      postgres:
        condition: service_healthy
    networks: [realestate-net]

  # rental: lich xem, don dat coc, saga dieu phoi listing + payment (T3.2). Job bu tru, het han: T3.3, T3.4.
  rental:
    <<: *restart
    build:
      context: ../..
      dockerfile: services/rental/Dockerfile
    container_name: re-rental
    profiles: [apps]
    environment:
      SERVICE_NAME: rental
      PORT: '3003'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-3000}
      HTTP_MAX_RETRIES: ${HTTP_MAX_RETRIES:-2}
      DATABASE_URL: postgres://${RENTAL_DB_USER:?thieu RENTAL_DB_USER}:${RENTAL_DB_PASSWORD:?thieu RENTAL_DB_PASSWORD}@postgres:5432/${RENTAL_DB_NAME:?thieu RENTAL_DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD:?thieu REDIS_PASSWORD}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?thieu RABBITMQ_USER}:${RABBITMQ_PASSWORD:?thieu RABBITMQ_PASSWORD}@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-domain.events}
      RABBITMQ_QUEUE: rental.payment-events
      INTERNAL_LISTING_URL: http://listing:3002
      INTERNAL_PAYMENT_URL: http://payment:3004
      LISTING_CALL_TIMEOUT_MS: ${LISTING_CALL_TIMEOUT_MS:-2000}
      PAYMENT_CALL_TIMEOUT_MS: ${PAYMENT_CALL_TIMEOUT_MS:-3000}
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-600}
      DEPOSIT_LOCK_TTL_MS: ${DEPOSIT_LOCK_TTL_MS:-10000}
      REFUND_WINDOW_SECONDS: ${REFUND_WINDOW_SECONDS:-172800}
      AUTO_RELEASE_SECONDS: ${AUTO_RELEASE_SECONDS:-259200}
      SAGA_RECONCILE_INTERVAL_MS: ${SAGA_RECONCILE_INTERVAL_MS:-15000}
      SAGA_STUCK_AFTER_SECONDS: ${SAGA_STUCK_AFTER_SECONDS:-30}
      HOLD_EXPIRY_INTERVAL_MS: ${HOLD_EXPIRY_INTERVAL_MS:-5000}
      RELEASE_REMINDER_SECONDS: ${RELEASE_REMINDER_SECONDS:-86400}
      AUTO_RELEASE_INTERVAL_MS: ${AUTO_RELEASE_INTERVAL_MS:-10000}
      DEADLINE_INTERVAL_MS: ${DEADLINE_INTERVAL_MS:-10000}
      # rental chi KIEM token (khoa cong khai), khong ky
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ISSUER: ${JWT_ISSUER:?thieu JWT_ISSUER}
    secrets: [jwt_public_key]
    # Khong co `ports:`: goi qua api-gateway (/api/v1/deposits, /api/v1/viewings)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
    networks: [realestate-net]

  # payment: payment order, payOS (T3.1). Webhook payOS, RabbitMQ, ví, S3 chung tu bat o T3.4, T3.6.
  payment:
    <<: *restart
    build:
      context: ../..
      dockerfile: services/payment/Dockerfile
    container_name: re-payment
    profiles: [apps]
    environment:
      SERVICE_NAME: payment
      PORT: '3004'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-3000}
      DATABASE_URL: postgres://${PAYMENT_DB_USER:?thieu PAYMENT_DB_USER}:${PAYMENT_DB_PASSWORD:?thieu PAYMENT_DB_PASSWORD}@postgres:5432/${PAYMENT_DB_NAME:?thieu PAYMENT_DB_NAME}
      # T3.4a: webhook phat payment.deposited, payment.late-payment-credited qua outbox (chi phat, khong nghe queue)
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?thieu RABBITMQ_USER}:${RABBITMQ_PASSWORD:?thieu RABBITMQ_PASSWORD}@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-domain.events}
      # Khoa payOS that chi nam trong .env (khong commit). De trong thi chinh payment bao thieu va dung
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:-http://localhost:3000/payment/return}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:-http://localhost:3000/payment/cancel}
      PAYOS_TIMEOUT_MS: ${PAYOS_TIMEOUT_MS:-2500}
      # T3.6 payout: Idempotency-Key (Redis), chung tu chuyen khoan (S3 payment-proofs), goi rental + identity
      REDIS_URL: redis://:${REDIS_PASSWORD:?thieu REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: ${S3_ENDPOINT:?thieu S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?thieu S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?thieu S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKETS: ${S3_BUCKET_PAYMENT_PROOFS:-payment-proofs}
      RECEIPT_MAX_BYTES: ${RECEIPT_MAX_BYTES:-5242880}
      INTERNAL_RENTAL_URL: http://rental:3003
      INTERNAL_IDENTITY_URL: http://identity:3001
      # payment chi KIEM token (khoa cong khai), khong ky
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ISSUER: ${JWT_ISSUER:?thieu JWT_ISSUER}
    secrets: [jwt_public_key]
    # Khong co `ports:`: chi goi duoc trong mang realestate-net (rental goi /internal/*, webhook qua api-gateway)
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [realestate-net]

  # api-gateway: diem vao duy nhat cho client. Khong dung DB, Redis, RabbitMQ, S3.
  api-gateway:
    <<: *restart
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    container_name: re-api-gateway
    profiles: [apps]
    environment:
      SERVICE_NAME: api-gateway
      PORT: '8080'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ISSUER: ${JWT_ISSUER:?thieu JWT_ISSUER}
      # Dia chi service dich trong mang Docker (ten service). Service chua co -> gateway tra 503.
      INTERNAL_IDENTITY_URL: http://identity:3001
      INTERNAL_LISTING_URL: http://listing:3002
      INTERNAL_RENTAL_URL: http://rental:3003
      INTERNAL_PAYMENT_URL: http://payment:3004
      INTERNAL_NOTIFICATION_URL: http://notification:3005
      GATEWAY_PROXY_TIMEOUT_MS: ${GATEWAY_PROXY_TIMEOUT_MS:-10000}
      RATE_LIMIT_TTL_SECONDS: ${RATE_LIMIT_TTL_SECONDS:-60}
      RATE_LIMIT_IP: ${RATE_LIMIT_IP:-100}
      RATE_LIMIT_USER: ${RATE_LIMIT_USER:-300}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    secrets: [jwt_public_key]
    ports:
      - '127.0.0.1:${GATEWAY_PORT:-8080}:8080'
    depends_on:
      identity:
        condition: service_healthy
    networks: [realestate-net]

networks:
  realestate-net:
    name: realestate-net

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  es_data:

# Khoa JWT RS256 sinh bang `pnpm keys:generate` (khong commit, xem .gitignore).
# Thieu file thi `up` profile apps bao loi thay vi tao thu muc rong nhu bind mount.
secrets:
  jwt_private_key:
    file: ../../secrets/jwt-private.pem
  jwt_public_key:
    file: ../../secrets/jwt-public.pem
